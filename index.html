document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

         <button sc-camel-on-click=\"{{ next.onRenew }}\" style=\"height:48px;border:none;border-radius:14px;background:#E3A12F;color:#14231C;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer\">Mark as renewed<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <span style=\"font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700\">Upcoming<\u002Fspan>\n              <sc-for list=\"{{ upcoming }}\" as=\"r\" hint-placeholder-count=\"5\">\n                <div style=\"background:#FFFFFF;border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center\">\n                  <div style=\"width:6px;align-self:stretch;border-radius:3px;background:{{ r.color }}\"><\u002Fdiv>\n                  <div style=\"flex:1;display:flex;flex-direction:column;gap:3px;min-width:0\">\n                    <span style=\"font-size:16px;font-weight:700\">{{ r.title }}<\u002Fspan>\n                    <span style=\"font-size:13px;color:#5E6862\">{{ r.vehicle }} · {{ r.dueText }}<\u002Fspan>\n                    <span style=\"font-size:12px;color:#5E6862\">{{ r.alertText }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:6px\">\n                    <span style=\"font-size:13px;font-weight:700;color:{{ r.color }}\">{{ r.daysText }}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ r.onRenew }}\" style=\"height:32px;padding:0 12px;border-radius:10px;border:1px solid #D6D0C2;background:#F4F1EA;font-family:inherit;font-size:12px;font-weight:600;color:#14231C;cursor:pointer\">Renewed<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"border:1.5px dashed #B9B2A2;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px\">\n              <span style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#1F5C45\">Coming in phase 2<\u002Fspan>\n              <span style=\"font-size:14px;line-height:1.45;color:#3B4A42\">Auto-sync with government portals — revenue licence, driving licence and traffic fines.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isVehicles }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:16px;padding-top:8px\">\n            <span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.02em\">My vehicles<\u002Fspan>\n            <sc-for list=\"{{ vehicles }}\" as=\"v\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ v.onOpen }}\" style=\"background:#FFFFFF;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center\">\n                  <span style=\"font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:0.02em;background:#F4D27A;padding:4px 10px;border-radius:8px;border:2px solid #14231C\">{{ v.plate }}<\u002Fspan>\n                  <span style=\"font-size:13px;color:#5E6862\">{{ v.type }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size:16px;font-weight:600\">{{ v.model }}<\u002Fspan>\n                <span style=\"font-size:13px;font-weight:600;color:{{ v.summaryColor }}\">{{ v.summary }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isVehicle }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:16px;padding-top:8px\">\n            <button sc-camel-on-click=\"{{ goVehicles }}\" style=\"align-self:flex-start;height:36px;padding:0 4px;border:none;background:none;font-family:inherit;font-size:15px;font-weight:600;color:#1F5C45;cursor:pointer\">‹ Vehicles<\u002Fbutton>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <span style=\"align-self:flex-start;font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;background:#F4D27A;padding:4px 12px;border-radius:8px;border:2px solid #14231C\">{{ vehicle.plate }}<\u002Fspan>\n              <span style=\"font-size:15px;color:#5E6862\">{{ vehicle.model }} · {{ vehicle.type }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ vehicle.items }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <div style=\"background:#FFFFFF;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center\">\n                  <span style=\"font-size:16px;font-weight:700\">{{ r.title }}<\u002Fspan>\n                  <span style=\"font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:{{ r.color }};color:#FFFFFF\">{{ r.statusLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px\">\n                  <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"color:#5E6862\">Due<\u002Fspan><span style=\"font-weight:600\">{{ r.dueText }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"color:#5E6862\">Amount<\u002Fspan><span style=\"font-weight:600\">{{ r.amountText }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"color:#5E6862\">Reminder<\u002Fspan><span style=\"font-weight:600\">{{ r.beforeText }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"color:#5E6862\">Repeats<\u002Fspan><span style=\"font-weight:600\">{{ r.repeatText }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ r.onRenew }}\" style=\"height:40px;border-radius:12px;border:1px solid #D6D0C2;background:#F4F1EA;font-family:inherit;font-size:14px;font-weight:600;color:#14231C;cursor:pointer\">Mark as renewed<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isAdd }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:20px;padding-top:8px\">\n            <span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.02em\">New reminder<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-size:13px;font-weight:600;color:#5E6862\">What is it for?<\u002Fspan>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n                <sc-for list=\"{{ catChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ c.onTap }}\" style=\"height:52px;border-radius:14px;border:1.5px solid {{ c.border }};background:{{ c.bg }};color:{{ c.color }};font-family:inherit;font-size:14px;font-weight:600;cursor:pointer\">{{ c.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-size:13px;font-weight:600;color:#5E6862\">Vehicle<\u002Fspan>\n              <div style=\"display:flex;gap:8px\">\n                <sc-for list=\"{{ vehChips }}\" as=\"c\" hint-placeholder-count=\"2\">\n                  <button sc-camel-on-click=\"{{ c.onTap }}\" style=\"flex:1;height:48px;border-radius:14px;border:1.5px solid {{ c.border }};background:{{ c.bg }};color:{{ c.color }};font-family:inherit;font-size:14px;font-weight:700;cursor:pointer\">{{ c.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n              <label style=\"display:flex;flex-direction:column;gap:8px\">\n                <span style=\"font-size:13px;font-weight:600;color:#5E6862\">Expiry / due date<\u002Fspan>\n                <input type=\"date\" value=\"{{ form.due }}\" sc-camel-on-change=\"{{ onDue }}\" style=\"height:48px;border-radius:14px;border:1.5px solid #D6D0C2;background:#FFFFFF;padding:0 12px;font-size:15px;color:#14231C;box-sizing:border-box;width:100%\">\n              <\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:8px\">\n                <span style=\"font-size:13px;font-weight:600;color:#5E6862\">Amount (Rs)<\u002Fspan>\n                <input type=\"number\" value=\"{{ form.amount }}\" sc-camel-on-change=\"{{ onAmount }}\" placeholder=\"0\" style=\"height:48px;border-radius:14px;border:1.5px solid #D6D0C2;background:#FFFFFF;padding:0 12px;font-size:15px;color:#14231C;box-sizing:border-box;width:100%\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"background:#FFFFFF;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center\">\n                <div style=\"display:flex;flex-direction:column;gap:2px\">\n                  <span style=\"font-size:15px;font-weight:700\">Remind me before<\u002Fspan>\n                  <span style=\"font-size:12px;color:#5E6862\">{{ defaultNote }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:10px\">\n                  <button sc-camel-on-click=\"{{ decBefore }}\" style=\"width:44px;height:44px;border-radius:12px;border:1px solid #D6D0C2;background:#F4F1EA;font-size:20px;cursor:pointer;color:#14231C\">−<\u002Fbutton>\n                  <span style=\"font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;min-width:30px;text-align:center\">{{ form.before }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ incBefore }}\" style=\"width:44px;height:44px;border-radius:12px;border:1px solid #D6D0C2;background:#F4F1EA;font-size:20px;cursor:pointer;color:#14231C\">+<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-size:13px;color:#3B4A42\">{{ alertPreview }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-size:13px;font-weight:600;color:#5E6862\">Repeats<\u002Fspan>\n              <div style=\"display:flex;gap:6px;background:#E7E2D6;padding:4px;border-radius:14px\">\n                <sc-for list=\"{{ repeatChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ c.onTap }}\" style=\"flex:1;height:40px;border:none;border-radius:10px;background:{{ c.bg }};color:#14231C;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer\">{{ c.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ save }}\" style=\"height:54px;border:none;border-radius:16px;background:#1F5C45;color:#F4F1EA;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer\">Save reminder<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:16px;padding-top:8px\">\n            <span style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.02em\">Default reminders<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.45;color:#3B4A42\">How many days before each due date we alert you. New reminders start with these — change any single reminder when you add it.<\u002Fspan>\n            <sc-for list=\"{{ settingsRows }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"background:#FFFFFF;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px\">\n                <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                  <span style=\"font-size:15px;font-weight:700\">{{ s.label }}<\u002Fspan>\n                  <span style=\"font-size:12px;color:#5E6862\">{{ s.hint }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px;flex-shrink:0\">\n                  <button sc-camel-on-click=\"{{ s.dec }}\" style=\"width:44px;height:44px;border-radius:12px;border:1px solid #D6D0C2;background:#F4F1EA;font-size:20px;cursor:pointer;color:#14231C\">−<\u002Fbutton>\n                  <span style=\"font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;min-width:28px;text-align:center\">{{ s.days }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ s.inc }}\" style=\"width:44px;height:44px;border-radius:12px;border:1px solid #D6D0C2;background:#F4F1EA;font-size:20px;cursor:pointer;color:#14231C\">+<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <span style=\"font-size:13px;color:#5E6862\">Days. A second nudge is sent on the due date itself.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;left:20px;right:20px;bottom:calc(100px + env(safe-area-inset-bottom));background:#14231C;color:#F4F1EA;border-radius:14px;padding:14px 16px;font-size:14px;font-weight:600\">{{ toast }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"position:absolute;left:0;right:0;bottom:0;min-height:76px;background:#FFFFFF;border-top:1px solid #E2DCCF;display:flex;align-items:flex-start;justify-content:space-around;padding:10px 0 env(safe-area-inset-bottom);box-sizing:border-box\">\n        <button sc-camel-on-click=\"{{ goHome }}\" style=\"width:80px;height:48px;border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;color:{{ tabHome }};cursor:pointer\">Home<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goVehicles }}\" style=\"width:80px;height:48px;border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;color:{{ tabVehicles }};cursor:pointer\">Vehicles<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goAdd }}\" style=\"width:56px;height:56px;margin-top:-22px;border-radius:28px;border:4px solid #F4F1EA;background:#1F5C45;color:#F4F1EA;font-size:28px;line-height:1;cursor:pointer;box-sizing:content-box\">+<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goSettings }}\" style=\"width:80px;height:48px;border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;color:{{ tabSettings }};cursor:pointer\">Settings<\u002Fbutton>\n      <\u002Fdiv>\n          <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst TODAY = new Date(2026, 9, 4);\nconst CATS = {\n  rl: { label: 'Revenue Licence', hint: 'Annual · needs valid emission & insurance', months: 12 },\n  ins: { label: 'Insurance', hint: 'Annual · compare quotes early', months: 12 },\n  emi: { label: 'Emission Test', hint: 'Annual · before revenue licence', months: 12 },\n  svc: { label: 'Service', hint: 'Every 6 months or by mileage', months: 6 },\n};\nconst VEH = [\n  { id: 'v1', plate: 'CAB-4521', model: 'Toyota Aqua 2016', type: 'Car' },\n  { id: 'v2', plate: 'BHK-7788', model: 'Honda Dio 110', type: 'Motorcycle' },\n];\nconst parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };\nconst fmt = s => parse(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });\nconst iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;\nconst daysTo = s => Math.round((parse(s) - TODAY) / 86400000);\nconst rs = n => n ? 'Rs ' + Number(n).toLocaleString('en-LK') : '—';\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'home', vehicleId: 'v1', toast: '',\n    defaults: { rl: 30, ins: 21, emi: 14, svc: 7 },\n    reminders: [\n      { id: 1, cat: 'ins', v: 'v1', due: '2026-10-11', amount: 48500, before: 21, months: 12 },\n      { id: 2, cat: 'rl', v: 'v1', due: '2026-10-28', amount: 3200, before: 30, months: 12 },\n      { id: 3, cat: 'emi', v: 'v1', due: '2026-10-20', amount: 1850, before: 14, months: 12 },\n      { id: 4, cat: 'svc', v: 'v1', due: '2026-12-15', amount: 18000, before: 7, months: 6 },\n      { id: 5, cat: 'rl', v: 'v2', due: '2026-09-30', amount: 1100, before: 30, months: 12 },\n      { id: 6, cat: 'ins', v: 'v2', due: '2027-02-10', amount: 6400, before: 21, months: 12 },\n      { id: 7, cat: 'emi', v: 'v2', due: '2027-01-22', amount: 650, before: 14, months: 12 },\n    ],\n    form: { cat: 'rl', v: 'v1', due: '2026-11-30', amount: '', before: 30, months: 12 },\n  };\n\n  flash(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: '' }), 2400);\n  }\n  renew(id) {\n    const r = this.state.reminders.find(x => x.id === id);\n    const d = parse(r.due); d.setMonth(d.getMonth() + r.months);\n    const due = iso(d);\n    this.setState(s => ({ reminders: s.reminders.map(x => x.id === id ? { ...x, due } : x) }));\n    this.flash(`${CATS[r.cat].label} renewed · next due ${fmt(due)}`);\n  }\n  decorate(r) {\n    const days = daysTo(r.due);\n    const veh = VEH.find(v => v.id === r.v);\n    let color = '#1F5C45', statusLabel = 'On track', status = 'ok';\n    if (days < 0) { color = '#B23A27'; statusLabel = 'Overdue'; status = 'over'; }\n    else if (days <= r.before) { color = '#9A6400'; statusLabel = 'Due soon'; status = 'soon'; }\n    const daysText = days < 0 ? `${-days}d overdue` : days === 0 ? 'Today' : `in ${days}d`;\n    return {\n      key: r.id, title: CATS[r.cat].label, vehicle: veh.plate, dueText: fmt(r.due), days, daysText, color, statusLabel, status,\n      amountText: rs(r.amount), beforeText: `${r.before} days before`,\n      repeatText: r.months === 12 ? 'Yearly' : r.months === 6 ? 'Every 6 months' : 'Monthly',\n      alertText: `Alert ${r.before} days before`,\n      bigNum: String(Math.abs(days)), bigUnit: days < 0 ? 'days overdue' : 'days left',\n      onRenew: () => this.renew(r.id),\n    };\n  }\n  renderVals() {\n    const { screen, reminders, defaults, form } = this.state;\n    const all = reminders.map(r => this.decorate(r)).sort((a, b) => a.days - b.days);\n    const setForm = p => this.setState(s => ({ form: { ...s.form, ...p } }));\n    const go = sc => () => this.setState({ screen: sc });\n    const chip = on => ({ bg: on ? '#14231C' : '#FFFFFF', color: on ? '#F4F1EA' : '#14231C', border: on ? '#14231C' : '#D6D0C2' });\n    const veh = VEH.find(v => v.id === this.state.vehicleId);\n    const alertDay = parse(form.due); alertDay.setDate(alertDay.getDate() - form.before);\n    const tab = k => (screen === k || (k === 'vehicles' && screen === 'vehicle')) ? '#1F5C45' : '#5E6862';\n    return {\n      isHome: screen === 'home', isVehicles: screen === 'vehicles', isVehicle: screen === 'vehicle',\n      isAdd: screen === 'add', isSettings: screen === 'settings',\n      tabHome: tab('home'), tabVehicles: tab('vehicles'), tabSettings: tab('settings'),\n      goHome: go('home'), goVehicles: go('vehicles'), goSettings: go('settings'),\n      goAdd: () => this.setState(s => ({ screen: 'add', form: { ...s.form, before: s.defaults[s.form.cat] } })),\n      overdueCount: all.filter(r => r.status === 'over').length,\n      soonCount: all.filter(r => r.status === 'soon').length,\n      okCount: all.filter(r => r.status === 'ok').length,\n      hasNext: all.length > 0, next: all[0] || {},\n      upcoming: all.slice(1),\n      vehicles: VEH.map(v => {\n        const mine = all.filter(r => r.vehicle === v.plate);\n        const over = mine.filter(r => r.status === 'over').length, soon = mine.filter(r => r.status === 'soon').length;\n        return { ...v, onOpen: () => this.setState({ screen: 'vehicle', vehicleId: v.id }),\n          summary: over ? `${over} overdue · ${soon} due soon` : soon ? `${soon} due soon` : `All ${mine.length} on track`,\n          summaryColor: over ? '#B23A27' : soon ? '#9A6400' : '#1F5C45' };\n      }),\n      vehicle: { ...veh, items: all.filter(r => r.vehicle === veh.plate) },\n      catChips: Object.keys(CATS).map(k => ({ label: CATS[k].label, ...chip(form.cat === k),\n        onTap: () => setForm({ cat: k, before: defaults[k], months: CATS[k].months }) })),\n      vehChips: VEH.map(v => ({ label: v.plate, ...chip(form.v === v.id), onTap: () => setForm({ v: v.id }) })),\n      repeatChips: [[12, 'Yearly'], [6, '6 months'], [1, 'Monthly']].map(([m, label]) => ({\n        label, bg: form.months === m ? '#FFFFFF' : 'transparent', onTap: () => setForm({ months: m }) })),\n      form,\n      onDue: e => setForm({ due: e.target.value || form.due }),\n      onAmount: e => setForm({ amount: e.target.value }),\n      incBefore: () => setForm({ before: Math.min(90, form.before + 1) }),\n      decBefore: () => setForm({ before: Math.max(1, form.before - 1) }),\n      defaultNote: `Default for ${CATS[form.cat].label}: ${defaults[form.cat]} days`,\n      alertPreview: `First alert on ${alertDay.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}, then again on the due date.`,\n      save: () => {\n        const r = { id: Date.now(), cat: form.cat, v: form.v, due: form.due, amount: Number(form.amount) || 0, before: form.before, months: form.months };\n        this.setState(s => ({ reminders: [...s.reminders, r], screen: 'home' }));\n        this.flash(`Reminder saved · ${CATS[form.cat].label}, ${VEH.find(v => v.id === form.v).plate}`);\n      },\n      settingsRows: Object.keys(CATS).map(k => ({ label: CATS[k].label, hint: CATS[k].hint, days: defaults[k],\n        inc: () => this.setState(s => ({ defaults: { ...s.defaults, [k]: Math.min(90, s.defaults[k] + 1) } })),\n        dec: () => this.setState(s => ({ defaults: { ...s.defaults, [k]: Math.max(1, s.defaults[k] - 1) } })) })),\n      hasToast: !!this.state.toast, toast: this.state.toast,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
